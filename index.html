<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mini FC Mobile</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; user-select:none; font-family:sans-serif; }
#game { display:block; width:100%; height:100%; }
#err { display:none; position:fixed; top:0; left:0; width:100%; padding:14px; color:#fff; background:rgba(180,0,0,0.95); font-family:monospace; font-size:13px; z-index:9999; word-break:break-all; line-height:1.4; }
</style>
<script>
window.addEventListener('error', function(ev){
  var el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.innerHTML = 'LOI: ' + (ev.message || 'unknown') + ' - Dong: ' + (ev.lineno || '?'); }
});
</script>
</head>
<body>
<div id="err"></div>
<canvas id="game"></canvas>
<script src="game.js"></script>
</body>
</html>
