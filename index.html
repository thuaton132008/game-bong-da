<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini FC Mobile</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    touch-action:none; user-select:none; font-family:sans-serif; }
  #game { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;

// ===== STATE =====
const SCOREBOARD_H = 62;
let homeScore = 0;
let awayScore = 0;
let goalMsg = null;
let goalCooldown = 0;

const player = { x:0, y:0, r:22, speed:5, color:'#2196f3' };
const enemy  = { x:0, y:0, r:22, speed:2.2, color:'#f44336' };
const ball   = { x:0, y:0, r:10, vx:0, vy:0 };

const joy = { active:false, id:null, baseX:0, baseY:0, x:0, y:0, R:70 };
const btnShoot = { x:0, y:0, r:45, pressed:false, id:null };

let goalWidth = 0, goalLeft = 0, goalRight = 0;
let fieldTop = 0, fieldBot = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = innerWidth;
  H = innerHeight;
  goalWidth = W * 0.34;
  goalLeft = W/2 - goalWidth/2;
  goalRight = W/2 + goalWidth/2;
  fieldTop = SCOREBOARD_H;
  fieldBot = H - 10;
}
window.addEventListener('resize', resize);

// ===== TOUCH =====
function onTouchStart(ev) {
  for (const t of ev.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (y < SCOREBOARD_H) continue;
    if (x > W/2) {
      btnShoot.pressed = true;
      btnShoot.id = t.identifier;
      shoot();
    } else {
      joy.active = true;
      joy.id = t.identifier;
      joy.baseX = x; joy.baseY = y;
      joy.x = x; joy.y = y;
    }
  }
  ev.preventDefault();
}
function onTouchMove(ev) {
  for (const t of ev.changedTouches) {
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.baseX;
      let dy = t.clientY - joy.baseY;
      const d = Math.hypot(dx, dy);
      if (d > joy.R) { dx = dx/d*joy.R; dy = dy/d*joy.R; }
      joy.x = joy.baseX + dx;
      joy.y = joy.baseY + dy;
    }
  }
  ev.preventDefault();
}
function onTouchEnd(ev) {
  for (const t of ev.changedTouches) {
    if (t.identifier === joy.id) { joy.active = false; joy.id = null; }
    if (t.identifier === btnShoot.id) { btnShoot.pressed = false; btnShoot.id = null; }
  }
  ev.preventDefault();
}
canvas.addEventListener('touchstart', onTouchStart, {passive:false});
canvas.addEventListener('touchmove', onTouchMove, {passive:false});
canvas.addEventListener('touchend', onTouchEnd, {passive:false});
canvas.addEventListener('touchcancel', onTouchEnd, {passive:false});

function shoot() {
  const d = Math.hypot(ball.x - player.x, ball.y - player.y);
  if (d < player.r + ball.r + 28) {
    let ax = 0, ay = -1;
    if (joy.active) {
      const dx = joy.x - joy.baseX;
      const dy = joy.y - joy.baseY;
      const len = Math.hypot(dx, dy);
      if (len > 10) { ax = dx/len; ay = dy/len; }
    } else {
      const tx = W/2, ty = fieldTop;
      const len = Math.hypot(tx - ball.x, ty - ball.y) || 1;
      ax = (tx - ball.x)/len;
      ay = (ty - ball.y)/len;
    }
    ball.vx = ax * 17;
    ball.vy = ay * 17;
  }
}

// ===== LOGIC =====
function init() { resize(); resetPositions(); }

function resetPositions() {
  player.x = W/2; player.y = H - 140;
  enemy.x = W/2;  enemy.y = fieldTop + 90;
  ball.x = W/2;   ball.y = H/2;
  ball.vx = 0; ball.vy = 0;
}

function triggerGoal(msg, color) {
  goalMsg = { text: msg, color: color, timer: 110 };
  goalCooldown = 150;
  ball.vx = 0; ball.vy = 0;
}

function update() {
  if (goalCooldown > 0) goalCooldown--;
  if (goalMsg) {
    goalMsg.timer--;
    if (goalMsg.timer <= 0) { goalMsg = null; resetPositions(); }
    return;
  }
  // Player
  if (joy.active) {
    const dx = joy.x - joy.baseX;
    const dy = joy.y - joy.baseY;
    const d = Math.hypot(dx, dy);
    if (d > 8) {
      player.x += (dx/d) * player.speed;
      player.y += (dy/d) * player.speed;
    }
  }
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(fieldTop + player.r, Math.min(H - player.r, player.y));

  // AI
  const ax = ball.x - enemy.x, ay = ball.y - enemy.y;
  const ad = Math.hypot(ax, ay);
  if (ad > 1) {
    enemy.x += (ax/ad) * enemy.speed;
    enemy.y += (ay/ad) * enemy.speed;
  }
  enemy.x = Math.max(enemy.r, Math.min(W - enemy.r, enemy.x));
  enemy.y = Math.max(fieldTop + enemy.r, Math.min(H - enemy.r, enemy.y));

  // Va chạm
  [player, enemy].forEach(p => {
    const d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d < p.r + ball.r && d > 0.01) {
      const ang = Math.atan2(ball.y - p.y, ball.x - p.x);
      const power = p === player ? 7 : 5;
      ball.vx = Math.cos(ang) * power;
      ball.vy = Math.sin(ang) * power;
    }
  });

  // Bóng di chuyển
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vx *= 0.965;
  ball.vy *= 0.965;
  if (Math.abs(ball.vx) < 0.05) ball.vx = 0;
  if (Math.abs(ball.vy) < 0.05) ball.vy = 0;

  // Tường trái/phải
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.8; }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -0.8; }

  // ===== GHI BÀN =====
  // Khung trên → PLAYER ghi bàn
  if (ball.y - ball.r < fieldTop + 8) {
    if (ball.x > goalLeft && ball.x < goalRight && goalCooldown <= 0) {
      homeScore++;
      triggerGoal('BẠN GHI BÀN!', '#4caf50');
      return;
    } else {
      ball.y = fieldTop + 8 + ball.r;
      ball.vy *= -0.8;
    }
  }
  // Khung dưới → AI ghi bàn
  if (ball.y + ball.r > fieldBot - 8) {
    if (ball.x > goalLeft && ball.x < goalRight && goalCooldown <= 0) {
      awayScore++;
      triggerGoal('ĐỐI THỦ GHI BÀN', '#f44336');
      return;
    } else {
      ball.y = fieldBot - 8 - ball.r;
      ball.vy *= -0.8;
    }
  }
}

// ===== DRAW =====
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  // Sân
  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(0, fieldTop, W, H - fieldTop);

  // Sọc cỏ
  const stripes = 10;
  const sh = (H - fieldTop) / stripes;
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  for (let i = 0; i < stripes; i++) {
    if (i % 2 === 1) ctx.fillRect(0, fieldTop + i * sh, W, sh);
  }

  // Vạch sân
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, (fieldTop + fieldBot) / 2);
  ctx.lineTo(W, (fieldTop + fieldBot) / 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(W/2, (fieldTop + fieldBot) / 2, Math.min(W, H) * 0.13, 0, Math.PI*2);
  ctx.stroke();
  // Vùng cấm
  ctx.strokeRect(W/2 - W*0.22, fieldTop, W*0.44, H*0.13);
  ctx.strokeRect(W/2 - W*0.22, fieldBot - H*0.13, W*0.44, H*0.13);

  // ===== KHUNG THÀNH =====
  // Khung trên
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 12; i++) {
    const x = goalLeft + (goalWidth * i / 12);
    ctx.beginPath();
    ctx.moveTo(x, fieldTop);
    ctx.lineTo(x, fieldTop + 14);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(goalLeft, fieldTop + 14);
  ctx.lineTo(goalRight, fieldTop + 14);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(goalLeft, fieldTop, goalWidth, 5);

  // Khung dưới
  for (let i = 0; i <= 12; i++) {
    const x = goalLeft + (goalWidth * i / 12);
    ctx.beginPath();
    ctx.moveTo(x, fieldBot - 14);
    ctx.lineTo(x, fieldBot);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(goalLeft, fieldBot - 14);
  ctx.lineTo(goalRight, fieldBot - 14);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(goalLeft, fieldBot - 5, goalWidth, 5);

  // ===== CẦU THỦ =====
  [player, enemy].forEach(p => {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(p.x, p.y + 4, p.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p === player ? '10' : '9', p.x, p.y + 1);
  });

  // ===== BÓNG =====
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.arc(ball.x, ball.y + 3, ball.r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 0.35, 0, Math.PI*2); ctx.fill();

  // ===== JOYSTICK =====
  if (joy.active) {
    ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, joy.R, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.13)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(joy.x, joy.y, 32, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(90, H - 100, 60, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('DI CHUYỂN', 90, H - 100);
  }

  // ===== NÚT SÚT =====
  btnShoot.x = W - 90;
  btnShoot.y = H - 100;
  ctx.beginPath(); ctx.arc(btnShoot.x, btnShoot.y + 3, btnShoot.r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
  ctx.beginPath(); ctx.arc(btnShoot.x, btnShoot.y, btnShoot.r, 0, Math.PI*2);
  const grd = ctx.createRadialGradient(btnShoot.x, btnShoot.y - 10, 5, btnShoot.x, btnShoot.y, btnShoot.r);
  if (btnShoot.pressed) {
    grd.addColorStop(0, '#ff5252'); grd.addColorStop(1, '#b71c1c');
  } else {
    grd.addColorStop(0, '#ff7070'); grd.addColorStop(1, '#c62828');
  }
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SÚT', btnShoot.x, btnShoot.y);

  // ===== SCOREBOARD =====
  drawScoreboard();

  // ===== GOAL CELEBRATION =====
  if (goalMsg) {
    const total = 110, t = goalMsg.timer;
    let a = 1;
    if (t > total - 12) a = (total - t) / 12;
    else if (t < 22) a = t / 22;

    ctx.fillStyle = `rgba(0,0,0,${0.78 * a})`;
    ctx.fillRect(0, H/2 - 100, W, 200);

    // Viền vàng
    ctx.strokeStyle = `rgba(255,215,0,${a})`;
    ctx.lineWidth = 4;
    ctx.strokeRect(0, H/2 - 100, W, 200);

    ctx.fillStyle = `rgba(255,215,0,${a})`;
    ctx.font = 'bold 52px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GOAL!', W/2, H/2 - 35);

    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(goalMsg.text, W/2, H/2 + 30);

    // Tỉ số hiện tại
    ctx.font = 'bold 28px sans-serif';
    ctx.fillStyle = `rgba(76,175,80,${a})`;
    ctx.fillText(String(homeScore), W/2 - 40, H/2 + 75);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('-', W/2, H/2 + 75);
    ctx.fillStyle = `rgba(244,67,54,${a})`;
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText(String(awayScore), W/2 + 40, H/2 + 75);
  }
}

function drawScoreboard() {
  ctx.fillStyle = 'rgba(10,10,20,0.92)';
  ctx.fillRect(0, 0, W, SCOREBOARD_H);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0, SCOREBOARD_H - 1, W, 1);

  const cy = SCOREBOARD_H / 2;
  const logoR = 19;

  // ===== LOGO ĐỘI BẠN (trái) =====
  const homeX = 60;
  // Vòng ngoài
  ctx.beginPath(); ctx.arc(homeX, cy, logoR + 2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fill();
  // Logo chính
  const grd1 = ctx.createRadialGradient(homeX - 5, cy - 5, 3, homeX, cy, logoR);
  grd1.addColorStop(0, '#64b5f6'); grd1.addColorStop(1, '#0d47a1');
  ctx.beginPath(); ctx.arc(homeX, cy, logoR, 0, Math.PI*2);
  ctx.fillStyle = grd1; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  // Chữ trong logo
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('FC', homeX, cy + 1);
  // Tên đội
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('ĐỘI BẠN', homeX + 26, cy - 6);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px sans-serif';
  ctx.fillText('HOME', homeX + 26, cy + 8);

  // ===== LOGO ĐỘI AI (phải) =====
  const awayX = W - 60;
  ctx.beginPath(); ctx.arc(awayX, cy, logoR + 2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fill();
  const grd2 = ctx.createRadialGradient(awayX - 5, cy - 5, 3, awayX, cy, logoR);
  grd2.addColorStop(0, '#ef5350'); grd2.addColorStop(1, '#b71c1c');
  ctx.beginPath(); ctx.arc(awayX, cy, logoR, 0, Math.PI*2);
  ctx.fillStyle = grd2; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('AI', awayX, cy + 1);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('ĐỘI AI', awayX - 26, cy - 6);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '10px sans-serif';
  ctx.fillText('AWAY', awayX - 26, cy + 8);

  // ===== TỈ SỐ (giữa) =====
  const sw = 96, sh = 40;
  const sx = W/2 - sw/2, sy = cy - sh/2;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(sx, sy, sw, sh, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
  roundRect(sx, sy, sw, sh, 10); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#4caf50';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(String(homeScore), W/2 - 20, cy + 1);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('-', W/2, cy + 1);
  ctx.fillStyle = '#f44336';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(String(awayScore), W/2 + 20, cy + 1);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
